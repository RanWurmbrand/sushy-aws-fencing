# FAR template for fencing EC2-backed nodes through sushy-tools' AWS driver.
#
# Path: FAR -> fence_redfish -> sushy-emulator (AWS driver) -> EC2 API
#
# Before applying, replace the placeholders under nodeparameters:
#   ip-10-0-0-N...  your real node names, as `oc get nodes` prints them
#   i-0123...       the EC2 instance ID backing each of those nodes
# and check that --ip matches wherever you run the emulator.
#
# Getting the node -> instance ID mapping (the node's providerID carries it):
#   oc get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.providerID}{"\n"}{end}'
#   # aws:///us-east-1a/i-0123456789abcdef0
---
apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediationTemplate
metadata:
  name: far-redfish-aws
  namespace: openshift-workload-availability
spec:
  template:
    spec:
      agent: fence_redfish

      # FAR defaults --action to "reboot" when it is not set. fence_redfish
      # performs a reboot as: ForceOff -> poll until Off -> On -> poll until
      # On. Those are the only calls the AWS driver needs to serve.
      sharedparameters:
        # The emulator runs as a Deployment in this namespace, pinned to a
        # control-plane node, so the agent reaches it by Service DNS.
        --ip: "sushy-emulator.openshift-workload-availability.svc"
        --ipport: "8000"
        # The emulator serves a self-signed certificate, and fence_redfish
        # only ever speaks HTTPS, so this is required.
        --ssl-insecure: ""
        # The emulator is unauthenticated; fence_redfish still insists on
        # being given a username and password, so these are placeholders.
        --username: "admin"
        --password: "admin"

        # --power-timeout is how long the agent waits for the instance to
        # reach the requested power state; it polls about once a second and
        # the agent's own default is only 20 seconds.
        #
        # Measured 2026-09-30 (m6i.xlarge, us-west-2): a force-stop took
        # 11, 19, 22 and 30 seconds over four runs, so the 20s default would
        # have failed half of them. Powering on was a steady 8-9s. 60 leaves
        # headroom over the worst case seen; re-check if you change instance
        # type or region.
        --power-timeout: "60"

      # fence_redfish discovers systems by listing /redfish/v1/Systems and
      # taking the LAST entry, so the correct instance must be named
      # explicitly per node. Without this, every node would fence whichever
      # instance happens to sort last.
      #
      # List your workers here, one line each. Masters should be left out:
      # nothing should fence them, and in particular not an emulator that
      # might be running on one.
      nodeparameters:
        --systems-uri:
          ip-10-0-0-1.us-east-1.compute.internal: "/redfish/v1/Systems/i-0123456789abcdef0"
          ip-10-0-0-2.us-east-1.compute.internal: "/redfish/v1/Systems/i-0fedcba9876543210"

      # Per-run timeout for one agent execution, then 5 retries 5s apart.
      # A retry is cheap: if the instance is already stopped the agent
      # reports "already off" and succeeds.
      timeout: "120s"
      retrycount: 5
      retryinterval: "5s"

      # OutOfServiceTaint also detaches PVs from the fenced node, which is
      # what you want if the workload uses storage. It needs k8s 1.26+ /
      # OCP 4.13+. Use ResourceDeletion if that is not available.
      remediationStrategy: OutOfServiceTaint
---
# Point NHC at the template above so unhealthy nodes get fenced.
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: nhc-redfish-aws
spec:
  remediationTemplate:
    apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
    kind: FenceAgentsRemediationTemplate
    name: far-redfish-aws
    namespace: openshift-workload-availability
  selector:
    matchExpressions:
      - key: node-role.kubernetes.io/worker
        operator: Exists
  unhealthyConditions:
    - type: Ready
      status: "False"
      duration: 300s
    - type: Ready
      status: Unknown
      duration: 300s
  minHealthy: "51%"
